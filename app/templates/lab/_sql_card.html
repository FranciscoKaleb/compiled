<div class="card">
    <div class="card__title">
        <h2 class="h3" style="margin:0">SQL the ORM ran</h2>
        <span class="badge badge--muted" id="sqlCount">0 statements</span>
        <label class="check small"><input type="checkbox" id="pause"> <span>Pause log</span></label>
        <button type="button" class="btn btn--secondary btn--small" id="clearLog">Clear</button>
    </div>
    <div class="wire" id="wire" role="log" aria-live="off" style="margin-top: var(--space-3); height: 560px"></div>
</div>
