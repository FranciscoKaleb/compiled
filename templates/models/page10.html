{% extends "models/base.html" %}

{% block title %}Model 10 - Face Recognition{% endblock %}

{% block content %}
<div class="models-content">
    <h5>Page 10</h5>
    <div class="models-card">
        <h2>Face Recognition Comparison</h2>
        <p>Upload two images to compare if they are the same person.</p>

        <div class="form-result-container">
            <div class="form-column">
                <form id="form10" enctype="multipart/form-data" aria-label="Face Recognition Comparison form" onsubmit="submitForm10(event)">
                    <label for="imageInput10a" class="sr-only">Upload image 1</label>
                    <input id="imageInput10a" type="file" name="image1" accept="image/*" required onchange="previewImage10a(event)">
                    <label for="imageInput10b" class="sr-only">Upload image 2</label>
                    <input id="imageInput10b" type="file" name="image2" accept="image/*" required onchange="previewImage10b(event)">
                    <button type="submit">Compare Faces</button>
                </form>
            </div>

            <div class="result-column">
                <div style="display: flex; gap: 16px;">
                    <div class="preview-image" style="flex:1;">
                        <img id="preview10a" class="preview-image">
                    </div>
                    <div class="preview-image" style="flex:1;">
                        <img id="preview10b" class="preview-image">
                    </div>
                </div>
            </div>
        </div>

        <div class="result result-fullwidth" id="result10"></div>
    </div>
</div>

<script>
function previewImage10a(event) {
    const preview = document.getElementById('preview10a');
    preview.src = URL.createObjectURL(event.target.files[0]);
    preview.style.display = 'block';
}

function previewImage10b(event) {
    const preview = document.getElementById('preview10b');
    preview.src = URL.createObjectURL(event.target.files[0]);
    preview.style.display = 'block';
}

function submitForm10(event) {
    event.preventDefault();
    const form = document.getElementById('form10');
    const formData = new FormData(form);
    fetch('/models/insightface2/predict', {
        method: 'POST',
        body: formData
    })
    .then(r => r.json())
    .then(data => {
        document.getElementById('result10').innerHTML =
            `<h3>Comparison Result:</h3>
            <p class="prediction">${data.message}</p>`;})
    .catch(err => {
        document.getElementById('result10').innerHTML = `<p style='color:red;'>Error: ${err.message}</p>`;
    });
}
</script>
{% endblock %}
