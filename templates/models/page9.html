{% extends "models/base.html" %}

{% block title %}Model 9 - InsightFace{% endblock %}

{% block content %}
<div class="models-content">
    <h5>Page 9</h5>
    <div class="models-card">
        <h2>InsightFace Detection</h2>
        <p>Upload an image to detect faces using InsightFace.</p>

        <div class="form-result-container">
            <div class="form-column">
                <form id="form9" enctype="multipart/form-data" aria-label="InsightFace Detection form">
                    <label for="imageInput9" class="sr-only">Upload image</label>
                    <input id="imageInput9" type="file" name="image" accept="image/*" required onchange="previewImage9(event)">
                    <button type="button" onclick="submitForm9()">Detect Faces</button>
                </form>
            </div>

            <div class="result-column">
                <div id="previewContainer9" class="preview-image">
                    <img id="preview9" class="preview-image">
                </div>
            </div>
        </div>

        <div class="result result-fullwidth" id="result9"></div>
    </div>
</div>

<script>
function previewImage9(event) {
    const file = event.target.files[0];
    const preview = document.getElementById('preview9');
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            preview.src = e.target.result;
            preview.style.display = 'block';
        };
        reader.readAsDataURL(file);
    } else {
        preview.src = '';
        preview.style.display = 'none';
    }
}

function submitForm9() {
    const form = document.getElementById('form9');
    const formData = new FormData(form);

    fetch('/models/insightface1/predict', {
        method: 'POST',
        body: formData
    })
    .then(r => r.json())
    .then(data => {
        let html = `<h3>Detection Result:</h3><p class="prediction">${data.message}</p>`;
        if (data.image_data) {
            // Replace preview with result image
            document.getElementById('preview9').src = `data:image/png;base64,${data.image_data}`;
        }
        document.getElementById('result9').innerHTML = html;
    });
}
</script>
{% endblock %}
