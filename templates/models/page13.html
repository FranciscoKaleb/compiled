{% extends "models/base.html" %}

{% block title %}Model 13 - Face Recognition Tracking{% endblock %}

{% block content %}
<div class="models-content">
<h5>Page 13</h5>
<h2>Face Recognition with Tracking</h2>
<p>Real-time face recognition that remembers names until face leaves frame</p>

<button id="startBtn" onclick="startCamera()">Start Camera</button>
<button id="stopBtn" onclick="stopCamera()">Stop Camera</button>

<div class="video-container" id="videoContainer">
    <img id="videoFeed" src="" width="640" height="480">
</div>

<script>
function startCamera() {
    document.getElementById('videoFeed').src = "{{ url_for('model13.video_feed') }}";
    document.getElementById('videoContainer').style.display = 'block';
    document.getElementById('startBtn').style.display = 'none';
    document.getElementById('stopBtn').style.display = 'inline-block';
}

function stopCamera() {
    document.getElementById('videoFeed').src = '';
    document.getElementById('videoContainer').style.display = 'none';
    document.getElementById('startBtn').style.display = 'inline-block';
    document.getElementById('stopBtn').style.display = 'none';
}
</script>
</div>
{% endblock %}
