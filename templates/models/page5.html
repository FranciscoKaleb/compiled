{% extends "models/base.html" %}

{% block title %}Object Detection - Model 5{% endblock %}

{% block content %}
<div class="models-content">
    <h5>Page 5</h5>
    <div class="models-card">
        <h1>Object Detection (Grounding DINO)</h1>
        <p>Upload an image and specify objects to detect.</p>

        <div class="form-result-container">
            <div class="form-column">
                <form id="form5" enctype="multipart/form-data" aria-label="Object detection form">
                    <label for="imageInput5" class="sr-only">Upload image</label>
                    <input id="imageInput5" type="file" name="image" accept="image/*" required onchange="previewImage5(event)">
                    <input type="text" name="text" placeholder="Enter objects to detect (e.g., 'cat. dog. person.')" required>
                    <button type="button" onclick="submitForm5()">Detect objects</button>
                </form>
            </div>

            <div class="result-column">
                
                    <img id="preview5" class="preview-image" >
                
            </div>
        </div>

        <div class="result result-fullwidth" id="result5"></div>
    </div>
</div>

<script>
function previewImage5(event) {
    const file = event.target.files[0];
    const preview = document.getElementById('preview5');
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            preview.src = e.target.result;
            preview.style.display = 'block';
        };
        reader.readAsDataURL(file);
    } else {
        preview.src = '';
        preview.style.display = 'none';
    }
}

function submitForm5() {
    const form = document.getElementById('form5');
    const formData = new FormData(form);

    fetch('/models/objectdetection3/predict', {
        method: 'POST',
        body: formData
    })
    .then(r => r.json())
    .then(data => {
        let html = '<strong>Detections:</strong><ul>';
        data.detections.forEach(d => {
            html += `<li>${d}</li>`;
        });
        html += '</ul>';
        if (data.image_data) {
            // Replace preview with result image (with bounding box)
            document.getElementById('preview5').src = `data:image/png;base64,${data.image_data}`;
        }
        document.getElementById('result5').innerHTML = html;
    });
}
</script>
{% endblock %}
