{% extends "models/base.html" %}

{% block title %}Model 7 - Human/Non-Human{% endblock %}

{% block content %}
<div class="models-content">
    <h5>Page 7</h5>
    <div class="models-card">
        <h2>Human/Non-Human Classification</h2>
        <p>Classify images as human or non-human.</p>

        <div class="form-result-container">
            <div class="form-column">
                <form id="form7" enctype="multipart/form-data" aria-label="Human/Non-Human form">
                    <label for="imageInput7" class="sr-only">Upload image</label>
                    <input id="imageInput7" type="file" name="image" accept="image/*" required onchange="previewImage7(event)">
                    <button type="button" onclick="submitForm7()">Classify</button>
                </form>
            </div>

            <div class="result-column">
                
                    <img id="preview7" class="preview-image">
                
            </div>
        </div>

        <div class="result result-fullwidth" id="result7"></div>
    </div>
</div>

<script>
function previewImage7(event) {
    const file = event.target.files[0];
    const preview = document.getElementById('preview7');
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            preview.src = e.target.result;
            preview.style.display = 'block';
        };
        reader.readAsDataURL(file);
    } else {
        preview.src = '';
        preview.style.display = 'none';
    }
}

function submitForm7() {
    const form = document.getElementById('form7');
    const formData = new FormData(form);

    fetch('/models/objectdetection5/predict', {
        method: 'POST',
        body: formData
    })
    .then(r => r.json())
    .then(data => {
        document.getElementById('result7').innerHTML = `<h3>Classification Result:</h3><p class="prediction">${data.label}</p>`;
    });
}
</script>
{% endblock %}
