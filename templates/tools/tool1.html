{% extends "tools/base.html" %}

{% block title %}PDF Combiner - Python Tools{% endblock %}

{% block content %}
<div class="tools-content">
    <div class="tools-card">
        <h1>PDF Combiner</h1>
        <p>Upload multiple PDF files to combine them into one.</p>

        <form id="uploadForm">
    <div id="dropZone">
        <p>Drag & Drop PDF files here</p>
        <p>or</p>
        <input type="file" id="fileInput" name="files" multiple accept=".pdf">
        <label for="fileInput" class="upload-btn">Choose Files</label>
        <div id="fileList"></div>
    </div>
    <button type="submit" id="combineBtn">Combine PDFs</button>
</form>

<div id="result">
    <p>PDFs combined successfully!</p>
    <button id="downloadBtn">Download Combined PDF</button>
</div>

<script>
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const fileList = document.getElementById('fileList');
const uploadForm = document.getElementById('uploadForm');
const combineBtn = document.getElementById('combineBtn');
const result = document.getElementById('result');
const downloadBtn = document.getElementById('downloadBtn');
let currentCounter = null;

dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.classList.add('dragover');
});

dropZone.addEventListener('dragleave', () => {
    dropZone.classList.remove('dragover');
});

dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    fileInput.files = e.dataTransfer.files;
    displayFiles();
});

fileInput.addEventListener('change', displayFiles);

function displayFiles() {
    fileList.innerHTML = '';
    const files = fileInput.files;
    
    if (files.length > 0) {
        for (let i = 0; i < files.length; i++) {
            const div = document.createElement('div');
            div.className = 'file-item';
            div.textContent = `${i + 1}. ${files[i].name}`;
            fileList.appendChild(div);
        }
        combineBtn.style.display = 'block';
    } else {
        combineBtn.style.display = 'none';
    }
}

uploadForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const formData = new FormData();
    for (let file of fileInput.files) {
        formData.append('files', file);
    }
    
    combineBtn.disabled = true;
    combineBtn.textContent = 'Combining...';
    
    try {
        const response = await fetch('/tools/tool1/upload', {
            method: 'POST',
            body: formData
        });
        
        const data = await response.json();
        
        if (data.success) {
            currentCounter = data.counter;
            result.style.display = 'block';
            uploadForm.style.display = 'none';
        } else {
            alert(data.error || 'Error combining PDFs');
            combineBtn.disabled = false;
            combineBtn.textContent = 'Combine PDFs';
        }
    } catch (error) {
        alert('Error: ' + error.message);
        combineBtn.disabled = false;
        combineBtn.textContent = 'Combine PDFs';
    }
});

downloadBtn.addEventListener('click', () => {
    window.location.href = `/tools/tool1/download/${currentCounter}`;
});
</script>
    </div>
</div>
{% endblock %}
