{% extends "tools/base.html" %}

{% block title %}Background Remover - Python Tools{% endblock %}

{% block content %}
<div class="tools-content">
    <div class="tools-card">
        <h1>Background Remover</h1>
        <p>Upload an image to remove its background.</p>

        <form id="uploadForm">
    <div id="uploadZone">
        <input type="file" id="fileInput" name="file" accept="image/*">
        <label for="fileInput" class="upload-btn">Upload Image</label>
    </div>
</form>

<div id="previewSection" style="display:none;">
    <h3>Preview</h3>
    <img id="preview" src="" alt="Preview">
    <br>
    <button id="removeBgBtn">Remove Background</button>
</div>

<div id="downloadSection" style="display:none;">
    <button id="downloadBtn">Download</button>
</div>

<style>
#uploadZone {
    border: 2px dashed #04AA6D;
    border-radius: 8px;
    padding: 40px;
    text-align: center;
    background-color: #f9f9f9;
}

#fileInput {
    display: none;
}

.upload-btn {
    display: inline-block;
    background-color: #04AA6D;
    color: white;
    padding: 10px 24px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 16px;
    transition: background-color 0.3s;
}

.upload-btn:hover {
    background-color: #059862;
}

#preview {
    max-width: 100%;
    max-height: 500px;
    margin: 15px 0;
    border: 1px solid #ccc;
    border-radius: 4px;
}
</style>

<script>
const fileInput = document.getElementById('fileInput');
const uploadForm = document.getElementById('uploadForm');
const previewSection = document.getElementById('previewSection');
const preview = document.getElementById('preview');
const removeBgBtn = document.getElementById('removeBgBtn');
const downloadSection = document.getElementById('downloadSection');
const downloadBtn = document.getElementById('downloadBtn');
let currentCounter = null;
let currentExt = null;

fileInput.addEventListener('change', async () => {
    const file = fileInput.files[0];
    if (!file) return;
    
    const formData = new FormData();
    formData.append('file', file);
    
    try {
        const response = await fetch('/tools/tool2/upload', {
            method: 'POST',
            body: formData
        });
        
        const data = await response.json();
        
        if (data.success) {
            currentCounter = data.counter;
            currentExt = data.ext;
            preview.src = URL.createObjectURL(file);
            previewSection.style.display = 'block';
            downloadSection.style.display = 'none';
        } else {
            alert(data.error || 'Error uploading image');
        }
    } catch (error) {
        alert('Error: ' + error.message);
    }
});

removeBgBtn.addEventListener('click', async () => {
    removeBgBtn.disabled = true;
    removeBgBtn.textContent = 'Processing...';
    
    try {
        const response = await fetch(`/tools/tool2/remove_bg/${currentCounter}/${currentExt}`, {
            method: 'POST'
        });
        
        const data = await response.json();
        
        if (data.success) {
            preview.src = `/tools/tool2/preview/${currentCounter}?t=${Date.now()}`;
            removeBgBtn.style.display = 'none';
            downloadSection.style.display = 'block';
        } else {
            alert('Error removing background');
            removeBgBtn.disabled = false;
            removeBgBtn.textContent = 'Remove Background';
        }
    } catch (error) {
        alert('Error: ' + error.message);
        removeBgBtn.disabled = false;
        removeBgBtn.textContent = 'Remove Background';
    }
});

downloadBtn.addEventListener('click', () => {
    window.location.href = `/tools/tool2/download/${currentCounter}`;
});
</script>
    </div>
</div>
{% endblock %}
