{% extends "blockchain/base.html" %}

{% block title %}View Blockchain{% endblock %}

{% block content %}
<div class="blockchain-content">
    <div class="blockchain-card">
        <h1>Blockchain</h1>
        <p>View all blocks in the blockchain</p>

        <div style="display: flex; gap: 15px; margin-bottom: 20px;">
    <button id="verifyBtn" style="background: linear-gradient(135deg, #04AA6D 0%, #059862 100%);">Verify Chain</button>
    <button id="rehashBtn" style="background: linear-gradient(135deg, #FF6B6B 0%, #EE5A52 100%);">Rehash Blocks</button>
    <div id="verifyStatus" style="padding: 12px 20px; border-radius: 8px; display: none;"></div>
</div>

<div id="blockchain" style="display: grid; gap: 20px;">
    <div style="text-align: center; color: #999; padding: 40px;">Loading blockchain...</div>
</div>

<div id="txModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
    <div style="background: white; border-radius: 12px; padding: 30px; max-width: 500px; width: 90%; box-shadow: 0 10px 40px rgba(0,0,0,0.3);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="margin: 0;">Transaction Details</h2>
            <button id="closeModal" style="background: none; border: none; font-size: 24px; cursor: pointer; color: #999;">&times;</button>
        </div>
        <div id="txDetails"></div>
    </div>
</div>

<script>
const blockchain = document.getElementById('blockchain');
const verifyBtn = document.getElementById('verifyBtn');
const verifyStatus = document.getElementById('verifyStatus');
const txModal = document.getElementById('txModal');
const closeModal = document.getElementById('closeModal');
const txDetails = document.getElementById('txDetails');

function showTxModal(tx) {
    txDetails.innerHTML = `
        <div style="display: grid; gap: 15px;">
            <div>
                <strong>Transaction ID:</strong><br>
                <code style="background: #f0f0f0; padding: 8px; border-radius: 4px; word-break: break-all;">${tx.tx_id}</code>
            </div>
            <div>
                <strong>From:</strong> ${tx.sender}
            </div>
            <div>
                <strong>To:</strong> ${tx.receiver}
            </div>
            <div>
                <strong>Amount:</strong> ${tx.amount} coins
            </div>
            <div>
                <strong>Type:</strong> ${tx.tx_type}
            </div>
            <div>
                <strong>Memo:</strong> ${tx.memo || 'N/A'}
            </div>
            <div>
                <strong>Timestamp:</strong> ${new Date(tx.timestamp).toLocaleString()}
            </div>
        </div>
    `;
    txModal.style.display = 'flex';
}

closeModal.addEventListener('click', () => {
    txModal.style.display = 'none';
});

txModal.addEventListener('click', (e) => {
    if (e.target === txModal) txModal.style.display = 'none';
});

async function loadBlockchain() {
    try {
        const response = await fetch('/blockchain/view');
        const blocks = await response.json();
        
        let html = '';
        blocks.forEach((block, idx) => {
            html += `
                <div style="background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); overflow: hidden;">
                    <div style="background: linear-gradient(135deg, #04AA6D 0%, #059862 100%); color: white; padding: 20px;">
                        <h3 style="margin: 0;">Block #${block.index}</h3>
                    </div>
                    <div style="padding: 20px;">
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                            <div>
                                <strong>Hash:</strong><br>
                                <code style="background: #f0f0f0; padding: 8px; border-radius: 4px; font-size: 12px; word-break: break-all;">${block.hash}</code>
                            </div>
                            <div>
                                <strong>Previous Hash:</strong><br>
                                <code style="background: #f0f0f0; padding: 8px; border-radius: 4px; font-size: 12px; word-break: break-all;">${block.previous_hash}</code>
                            </div>
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                            <div>
                                <strong>Merkle Root:</strong><br>
                                <code style="background: #f0f0f0; padding: 8px; border-radius: 4px; font-size: 12px; word-break: break-all;">${block.merkle_root}</code>
                            </div>
                            <div>
                                <strong>Nonce:</strong> ${block.nonce}<br>
                                <strong>Timestamp:</strong> ${new Date(block.timestamp).toLocaleString()}
                            </div>
                        </div>
                        <div>
                            <strong>Transactions (${block.transactions.length}):</strong>
                            <div style="margin-top: 10px;">
                                ${block.transactions.length === 0 ? '<em style="color: #999;">No transactions</em>' : 
                                    block.transactions.map(tx => `
                                        <div style="background: #f9f9f9; padding: 10px; border-radius: 6px; margin-bottom: 8px; font-size: 13px; cursor: pointer; transition: all 0.2s;" onmouseover="this.style.background='#e8f5f0'; this.style.boxShadow='0 2px 8px rgba(4,170,109,0.2)';" onmouseout="this.style.background='#f9f9f9'; this.style.boxShadow='none';" onclick="showTxModal(${JSON.stringify(tx).replace(/"/g, '&quot;')})">
                                            <strong>${tx.sender}</strong> → <strong>${tx.receiver}</strong>: <strong>${tx.amount}</strong> coins
                                            <br><small style="color: #999;">${tx.tx_id}</small>
                                        </div>
                                    `).join('')
                                }
                            </div>
                        </div>
                    </div>
                </div>
            `;
        });
        
        blockchain.innerHTML = html;
    } catch (error) {
        console.error('Error loading blockchain:', error);
    }
}

const rehashBtn = document.getElementById('rehashBtn');

rehashBtn.addEventListener('click', async () => {
    try {
        const response = await fetch('/blockchain/rehash');
        const res = await response.json();
        
        let details = '<div style="max-height: 300px; overflow-y: auto;">';
        res.blocks.forEach(block => {
            const color = block.valid ? '#04AA6D' : '#FF6B6B';
            details += `
                <div style="background: ${color}20; border-left: 4px solid ${color}; padding: 10px; margin-bottom: 8px; border-radius: 4px;">
                    <strong>Block #${block.index}:</strong> ${block.valid ? '✓ Valid' : '✗ Tampered'}<br>
                    <small style="color: #666;">Hash - Stored: ${block.stored_hash.substring(0, 12)}... Recalc: ${block.recalculated_hash.substring(0, 12)}...</small><br>
                    <small style="color: #666;">Merkle - Stored: ${block.stored_merkle.substring(0, 12)}... Recalc: ${block.recalculated_merkle.substring(0, 12)}...</small>
                </div>
            `;
        });
        details += '</div>';
        
        verifyStatus.style.display = 'block';
        verifyStatus.innerHTML = details;
        verifyStatus.style.background = res.valid ? '#d9f9ed' : '#ffe0e0';
    } catch (error) {
        alert('Error: ' + error.message);
    }
});

verifyBtn.addEventListener('click', async () => {
    try {
        const response = await fetch('/blockchain/verify');
        const res = await response.json();
        
        verifyStatus.style.display = 'block';
        if (res.valid) {
            verifyStatus.style.background = '#d9f9ed';
            verifyStatus.style.color = '#04AA6D';
            verifyStatus.textContent = '✓ Blockchain is valid';
        } else {
            verifyStatus.style.background = '#ffe0e0';
            verifyStatus.style.color = '#c00b0b';
            verifyStatus.textContent = '✗ Blockchain is invalid';
        }
    } catch (error) {
        alert('Error: ' + error.message);
    }
});

loadBlockchain();
</script>
    </div>
</div>
{% endblock %}
