{% extends "base.html" %}

{% block title %}View Blockchain - Authorized Node{% endblock %}

{% block sidebar %}
{% include 'blockchain2/authorized_node/_sidebar.html' %}
{% endblock %}

{% block content %}
{% include 'blockchain2/_header.html' %}

<div style="max-width: 1200px; margin: 0 auto; padding: 0 20px;">
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;\">
    <h1>Blockchain</h1>
</div>

<div id="user-info" style="background: white; padding: 15px; border-radius: 8px; margin-bottom: 20px;\"></div>

<div id="blockchain-content" style="background: white; padding: 15px; border-radius: 8px; max-height: 600px; overflow-y: auto;\"></div>

<script>
window.addEventListener('load', () => {
    fetch('/blockchain2/get-user')
        .then(r => r.json())
        .then(data => {
            if (data.user) {
                document.getElementById('user-info').innerHTML = `
                    <strong>${data.user.username}</strong> (${data.user.role}) - ${data.user.agency}
                `;
                loadBlockchain();
                setInterval(loadBlockchain, 3000);
            } else {
                window.location.href = '/blockchain2/login';
            }
        });
});

function loadBlockchain() {
    fetch('/blockchain2/view-blockchain')
        .then(r => r.json())
        .then(data => {
            const html = data.blocks.map(b => `
                <div style="padding: 15px; border-bottom: 1px solid #eee; background: #f9f9f9; border-radius: 6px; margin-bottom: 10px;\">
                    <strong style="color: #04AA6D;\">Block ${b.height}</strong><br>
                    <small style="color: #666;\">
                        Transactions: ${b.tx_count} | 
                        Proposer: ${b.proposer}<br>
                        Hash: <code style="background: #f0f0f0; padding: 2px 6px; border-radius: 3px; font-size: 11px;\">${b.hash.substring(0, 16)}...</code><br>
                        Timestamp: ${new Date(b.timestamp).toLocaleString()}
                    </small>
                </div>
            `).join('');
            document.getElementById('blockchain-content').innerHTML = html || '<p style="color: #999;\">No blocks yet</p>';
        });
}

function logout() {
    fetch('/blockchain2/logout', {method: 'POST'})
    .then(() => {
        window.location.href = '/blockchain2';
    });
}
</script>
</div>
{% endblock %}
