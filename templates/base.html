<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Compiled{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <!-- <link rel="stylesheet" href="{{ url_for('static', filename='blockchain2.css') }}"> -->
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="header">
        <h1> Compiled apps</h1>
        <nav>
            <a href="/">Home</a>
            <a href="/models/sentimentanalysis1">Models</a>
            <a href="/tools/tool1">Tools</a>
            <a href="/blockchain">Blockchain</a>
            <a href="/blockchain2">Blockchain 2</a>
            <a href="/gallery">Gallery</a>
        </nav>
    </div>
    <div class="main-container">
        <div class="content">
            <div class="sidebar-wrapper" style="position: relative;">
                {% block sidebar %}{% endblock %}
                <div class="sidebar-resizer"></div>
            </div>
            {% block content %}{% endblock %}
        </div>
    </div>
    <script>
    function previewImage(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const preview = document.getElementById('preview');
                preview.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }
    }

    const resizer = document.querySelector('.sidebar-resizer');
    const sidebar = document.querySelector('.sidebar');
    const wrapper = document.querySelector('.sidebar-wrapper');
    let isResizing = false;

    // Restore sidebar width on page load
    window.addEventListener('load', () => {
        const savedWidth = localStorage.getItem('sidebarWidth');
        if (savedWidth) {
            sidebar.style.width = savedWidth + 'px';
            wrapper.style.width = savedWidth + 'px';
        }
    });

    resizer.addEventListener('mousedown', () => {
        isResizing = true;
    });

    document.addEventListener('mousemove', (e) => {
        if (!isResizing) return;
        const newWidth = e.clientX - wrapper.getBoundingClientRect().left;
        if (newWidth > 150 && newWidth < 600) {
            sidebar.style.width = newWidth + 'px';
            wrapper.style.width = newWidth + 'px';
            localStorage.setItem('sidebarWidth', newWidth);
        }
    });

    document.addEventListener('mouseup', () => {
        isResizing = false;
    });
    </script>
</body>
</html>
